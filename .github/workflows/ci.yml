name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q

  kafka-integration:
    name: Kafka integration (Redpanda)
    runs-on: ubuntu-latest
    needs: test
    env:
      KAFKA_INTEGRATION: "1"
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Start Redpanda (Kafka-compatible broker)
        run: |
          docker run -d --name redpanda -p 9092:9092 redpandadata/redpanda:latest \
            redpanda start --mode dev-container --smp 1 --overprovisioned \
            --kafka-addr PLAINTEXT://0.0.0.0:9092 \
            --advertise-kafka-addr PLAINTEXT://localhost:9092
          for i in $(seq 1 30); do
            if docker exec redpanda rpk cluster health | grep -q 'Healthy:.*true'; then echo "Redpanda is up"; exit 0; fi
            sleep 2
          done
          docker logs redpanda; exit 1
      - name: Ping broker
        run: python -m ingestion ping
      - name: Produce → consume → DuckDB round trip
        run: pytest -m kafka -v
