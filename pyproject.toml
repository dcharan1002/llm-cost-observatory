[project]
name = "llm-cost-observatory"
version = "0.1.0"
description = "Real-time FinOps for LLM APIs"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["generator/tests", "ingestion/tests"]
pythonpath = ["."]
markers = ["kafka: needs a real Kafka broker (KAFKA_INTEGRATION=1)"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["frontend", "dbt_project"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
